<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gianni Battaglia – Work</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <div class="header-text">
    <div class="header-left">
      <a href="index.html">Gianni Battaglia</a>
    </div>

    <div class="header-right">
      <a href="work.html" data-de="Arbeiten" data-en="Work">Work</a>
      <a href="about.html" data-de="Über" data-en="About">About</a>
      <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Sprache wechseln">EN</button>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="narrativ">Narrativ</button>
    <button class="filter-btn" data-filter="commercial">Commercial</button>
  </div>

  <!-- Work Grid -->
  <main class="work-grid">

    <div class="project" data-category="narrativ">
      <a href="projects/project4.html">
        <img src="images/project4.jpg" alt="Am Tag davor">
        <h3>Am Tag davor</h3>
      </a>
    </div>
    <div class="project" data-category="narrativ">
      <a href="projects/project1.html">
        <img src="images/project1.jpg" alt="Project 1">
        <h3>Ma non è niente!</h3>
      </a>
    </div>
    <div class="project" data-category="narrativ">
      <a href="projects/project2.html">
        <img src="images/project2.jpg" alt="Project 2">
        <h3>Männersache</h3>
      </a>
    </div>
    <div class="project" data-category="narrativ">
      <a href="projects/project3.html">
        <img src="images/project3.jpg" alt="Project 3">
        <h3>Running Gag</h3>
      </a>
    </div>
    <!-- Weitere Projekte hier hinzufügen -->
  </main>

  <script>
    const buttons = document.querySelectorAll('.filter-btn');
    const projects = document.querySelectorAll('.project');

    function filterProjects(category) {
      projects.forEach(p => {
        p.style.display = p.dataset.category === category ? '' : 'none';
      });
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterProjects(btn.dataset.filter);
      });
    });

    filterProjects('narrativ');
  </script>

  <script src="lang-toggle.js"></script>

 <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">© Gianni Battaglia</div>
    <div class="footer-center">
      <a href="https://www.instagram.com/giann1.i/" target="_blank">Instagram</a>
    </div>
    <div class="footer-right">
      <a href="mailto:battaglia.gianni@gmx.ch">battaglia.gianni@gmx.ch</a>
    </div>
  </footer>
</body>
</html>
